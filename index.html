<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angkor web</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
html,body{height:100%}
body{background:#f7f8fa;color:#222;line-height:1.7;padding-top:45px;display:flex;flex-direction:column}
.header-fixed{position:fixed;top:0;left:0;width:100%;height:45px;background:#fff;border-bottom:2px solid #e5e7eb;display:flex;align-items:center;padding:0 16px;z-index:90}
.avatar{height: 35px;border-radius:50%;object-fit:cover;margin-right:12px;border:1px solid #eee}
.site-title{margin-top: 2px;font-size:18px;font-weight:600;color:#111827}
.container{max-width:820px;margin:0 auto;padding:24px 16px;flex:1;width:100%}
.news-card{background:#fff;padding:20px;border-radius:10px;margin-bottom:16px;cursor:pointer;border:1px solid #e5e7eb;transition:.2s}
.news-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.07)}
.news-date{font-size:13px;color:#6b7280;margin-bottom:6px}
.news-card h3{font-size:19px;color:#111827;margin-bottom:8px}
.news-summary{color:#4b5563;font-size:15px;display:-webkit-box;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-detail{display:none}
.detail-header{margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid #e5e7eb}
.detail-title{font-size:30px;line-height:1.3;margin-bottom:12px;color:#111827}
.detail-meta{color:#6b7280;font-size:14px}
.detail-body{font-size:17px}
.detail-body p{margin-bottom:18px}
.detail-body h2{font-size:22px;margin:28px 0 12px;color:#1f2937}
.detail-body h3{font-size:19px;margin:24px 0 10px;color:#333}
.detail-body img{max-width:100%;border-radius:8px;margin:16px 0;display:block}
.detail-body a{color:#2563eb;text-decoration:none}
.detail-body a:hover{text-decoration:underline}
.detail-body ul,.detail-body ol{margin:16px 0 16px 24px}
.detail-body blockquote{border-left:4px solid #cbd5e1;padding:12px 16px;margin:18px 0;background:#f8fafc;color:#475569}
.detail-body code{background:#f1f5f9;padding:2px 6px;border-radius:4px;font-family:monospace}
.back-btn{position:fixed;top:52px;right:18px;z-index:95;display:none;width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid #e5e7eb;cursor:pointer;font-size:22px;color:#444;text-align:center;line-height:40px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.back-btn:hover{background:#f3f4f6}
footer{width:100%;border-top:2px solid #e5e7eb;padding:5px;background-color: #fff;color:black;font-size:14px;margin-top:auto}
.footer-inner{max-width:820px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.footer-icon{width:18px;height:18px;vertical-align:middle;opacity:0.75;transition:0.2s;cursor:pointer}
.footer-icon:hover{opacity:1}
@media (prefers-color-scheme: dark){
    .footer-icon{filter:invert(1)}
}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:6px;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:0.9}
</style>
</head>
<body>
<header class="header-fixed">
<div class="container" style="padding:0;display:flex;align-items:center">
<img class="avatar" src="https://img.remit.ee/i/6uew0jOf0zPS" alt="avatar">
<div class="site-title">Angkor's web</div>
</div>
</header>
<div class="back-btn" id="backBtn" title="返回列表">×</div>
<main class="container">
<section class="news-list" id="listView"></section>
<section class="news-detail" id="detailView">
<div class="detail-header">
<h1 class="detail-title" id="detailTitle"></h1>
<div class="detail-meta" id="detailDate"></div>
</div>
<div class="detail-body" id="detailContent"></div>
</section>
</main>
<footer id="pageFooter">
<div class="footer-inner">
<div>
<img class="footer-icon" id="copyMailIcon"
     src="https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/gmail.svg"
     title="邮箱：1220718305@qq.com 点击复制" alt="邮箱">
<a href="https://github.com/Angkor-w" target="_blank"><img title="进入作者Github主页" class="footer-icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/github.svg" alt="GitHub"></a>
<a href="https://qq.com" target="_blank"><img title="进入作者QQ主页" class="footer-icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/qq.svg" alt="QQ"></a>
<a href="https://space.bilibili.com/3546862837565494?spm_id_from=333.1007.0.0" target="_blank"><img title="进入作者BiliBili主页" class="footer-icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/bilibili.svg" alt="Bilibili"></a>
</div>
<div>
<span><strong>Github Pages</strong></span>
</div>
</div>
</footer>
<div class="toast" id="toast"></div>
<script src="./articles.js"></script>
<script>
const listView=document.getElementById('listView');
const detailView=document.getElementById('detailView');
const backBtn=document.getElementById('backBtn');
const detailTitle=document.getElementById('detailTitle');
const detailDate=document.getElementById('detailDate');
const detailContent=document.getElementById('detailContent');
const copyMailIcon=document.getElementById('copyMailIcon');
const toast=document.getElementById('toast');
const MAIL="1220718305@qq.com";
//复制邮箱
copyMailIcon.addEventListener('click',async ()=>{
  try{
    await navigator.clipboard.writeText(MAIL);
    showToast("已复制邮箱");
  }catch(e){
    //降级兼容
    const input=document.createElement('input');
    input.value=MAIL;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
    showToast("已复制邮箱");
  }
})
function showToast(text){
  toast.innerText=text;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1800);
}
function renderList(){
listView.innerHTML='';
articles.forEach((item,idx)=>{
const card=document.createElement('div');
card.className='news-card';
card.onclick=()=>openDetail(idx);
card.innerHTML=`<div class="news-date">${item.date}</div><h3>${item.title}</h3><div class="news-summary">${item.desc}</div>`;
listView.appendChild(card);
})
}
function openDetail(i){
const item=articles[i];
detailTitle.innerText=item.title;
detailDate.innerText=item.date;
detailContent.innerHTML=item.content;
listView.style.display='none';
detailView.style.display='block';
backBtn.style.display='block';
window.scrollTo(0,0);
}
function backToList(){
listView.style.display='block';
detailView.style.display='none';
backBtn.style.display='none';
window.scrollTo(0,0);
}
backBtn.addEventListener('click',backToList);
renderList();
</script>
</body>
</html>
