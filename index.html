<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资料库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
html,body{height:100%}
body{background:#f7f8fa;color:#222;line-height:1.7;padding-top:45px;padding-bottom:48px}
.header-fixed{position:fixed;top:0;left:0;width:100%;height:45px;background:#fff;border-bottom:2px solid #e5e7eb;z-index:90}
.header-inner{max-width:820px;margin:0 auto;padding:0 16px;height:100%;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center}
.avatar{height:35px;border-radius:50%;object-fit:cover;margin-right:12px;border:1px solid #eee}
.site-title{margin-top:2px;font-size:18px;font-weight:600;color:#111827;transition:0.2s}
.site-title.hide-title{display:none}
.back-btn{display:none;width:34px;height:34px;border-radius:20%;background:#fff;border:1px solid #2563eb;cursor:pointer;font-size:21px;color:black;text-align:center;line-height:31px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.back-btn:hover{background:#f3f4f6}
.container{max-width:820px;margin:0 auto;padding:16px 16px 40px 16px;width:100%}
.news-card{position:relative;background:#fff;padding:20px;border-radius:10px;margin-bottom:16px;cursor:pointer;border:1px solid #e5e7eb;transition:.2s}
.news-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.07)}
.news-date{font-size:13px;color:#6b7280;margin-bottom:6px}
.news-card h3{font-size:19px;color:#111827;margin-bottom:8px}
.news-summary{color:#4b5563;font-size:15px;display:-webkit-box;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:6px;color:#fff;font-weight:bold;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
.badge-1{background:linear-gradient(135deg,#ff3b30,#ff6b5b)}
.badge-2{background:linear-gradient(135deg,#ff9500,#ffcc00)}
.badge-3{background:linear-gradient(135deg,#007aff,#5856d6)}
.badge-normal{background:#9ca3af}

.news-detail{display:none}
.detail-header{margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid #e5e7eb}
.detail-title{font-size:30px;line-height:1.3;margin-bottom:12px;color:#111827}
.detail-meta{color:#6b7280;font-size:14px}
.detail-body{font-size:17px}
.detail-body p{margin-bottom:18px}
.detail-body h2{font-size:22px;margin:28px 0 12px;color:#1f2937}
.detail-body h3{font-size:19px;margin:24px 0 10px;color:#333}
.detail-body img{max-width:100%;border-radius:8px;margin:16px 0;display:block}
.detail-body a{color:#2563eb;text-decoration:none}
.detail-body a:hover{text-decoration:underline}
.detail-body ul,.detail-body ol{margin:16px 0 16px 24px}
.detail-body blockquote{border-left:4px solid #cbd5e1;padding:12px 16px;margin:18px 0;background:#f8fafc;color:#475569}
.detail-body code{background:#f1f5f9;padding:2px 6px;border-radius:4px;font-family:monospace}
footer{position:fixed;bottom:0;left:0;width:100%;border-top:2px solid #e5e7eb;padding:8px 0;background-color:#fff;color:black;font-size:15px;z-index:80}
.footer-inner{max-width:820px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.footer-icon{width:18px;height:18px;vertical-align:middle;opacity:0.75;transition:0.2s;cursor:pointer;filter:brightness(0) saturate(100%) invert(34%) sepia(89%) saturate(1700%) hue-rotate(205deg) brightness(92%) contrast(93%)}
.footer-icon:hover{opacity:1}
.toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:6px;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:0.9}
</style>
</head>
<body>
<header class="header-fixed">
<div class="header-inner">
    <div class="header-left">
        <img class="avatar" src="https://img.remit.ee/i/6uew0jOf0zPS" alt="avatar">
        <div class="site-title" id="siteTitle">Angkor</div>
    </div>
    <div class="back-btn" id="backBtn">×</div>
</div>
</header>
<main class="container">
<section class="news-list" id="listView"></section>
<section class="news-detail" id="detailView">
<div class="detail-header">
<h1 class="detail-title" id="detailTitle"></h1>
<div class="detail-meta" id="detailDate"></div>
</div>
<div class="detail-body" id="detailContent"></div>
</section>
</main>
<footer id="pageFooter">
<div class="footer-inner">
<div>
<img class="footer-icon" id="copyMailIcon" src="https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/gmail.svg" title="邮箱：1220718305@qq.com 点击复制" alt="邮箱">
<a href="https://github.com/Angkor-w" target="_blank"><img title="进入作者Github主页" class="footer-icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/github.svg" alt="GitHub"></a>
<a href="https://qq.com" target="_blank"><img title="进入作者QQ主页" class="footer-icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/qq.svg" alt="QQ"></a>
<a href="https://space.bilibili.com/3546862837565494?spm_id_from=333.1007.0.0" target="_blank"><img title="进入作者BiliBili主页" class="footer-icon" src="https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/bilibili.svg" alt="Bilibili"></a>
</div>
<div>
<span><strong>Github Pages</strong></span>
</div>
</div>
</footer>
<div class="toast" id="toast"></div>
<script src="./articles.js"></script>
<script>
const listView=document.getElementById('listView');
const detailView=document.getElementById('detailView');
const backBtn=document.getElementById('backBtn');
const detailTitle=document.getElementById('detailTitle');
const detailDate=document.getElementById('detailDate');
const detailContent=document.getElementById('detailContent');
const copyMailIcon=document.getElementById('copyMailIcon');
const toast=document.getElementById('toast');
const siteTitle=document.getElementById('siteTitle');
const MAIL="1220718305@qq.com";
let savedScrollY=0;

copyMailIcon.addEventListener('click',async ()=>{
  try{
    await navigator.clipboard.writeText(MAIL);
    showToast("已复制邮箱");
  }catch(e){
    const input=document.createElement('input');
    input.value=MAIL;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
    showToast("已复制邮箱");
  }
})
function showToast(text){
  toast.innerText=text;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1800);
}

function renderList(){
listView.innerHTML='';
articles.forEach((item,idx)=>{
const card=document.createElement('div');
card.className='news-card';
card.onclick=()=>openDetail(idx);

let badgeHtml='';
if(idx===0){
  badgeHtml=`<div class="badge badge-1">1</div>`;
}else if(idx===1){
  badgeHtml=`<div class="badge badge-2">2</div>`;
}else if(idx===2){
  badgeHtml=`<div class="badge badge-3">3</div>`;
}else{
  badgeHtml=`<div class="badge badge-normal">${idx+1}</div>`;
}

card.innerHTML=`
${badgeHtml}
<div class="news-date">${item.date}</div>
<h3>${item.title}</h3>
<div class="news-summary">${item.desc}</div>
`;
listView.appendChild(card);
})
}

function openDetail(i){
  savedScrollY=window.scrollY;
  const item=articles[i];
  detailTitle.innerText=item.title;
  detailDate.innerText=item.date;
  detailContent.innerHTML=item.content;
  listView.style.display='none';
  detailView.style.display='block';
  backBtn.style.display='block';
  siteTitle.classList.add('hide-title');
  window.scrollTo(0,0);
}
function backToList(){
  listView.style.display='block';
  detailView.style.display='none';
  backBtn.style.display='none';
  siteTitle.classList.remove('hide-title');
  window.scrollTo(0,savedScrollY);
}
backBtn.addEventListener('click',backToList);
renderList();
</script>
</body>
</html>
